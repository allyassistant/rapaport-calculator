name: Update Rapaport data.json

on:
  schedule:
    # Every Thursday at 12:05 AM ET (05:05 UTC = after Rapaport Thursday 11:59pm ET publish)
    - cron: '5 5 * * 4'
  workflow_dispatch:   # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Rapaport prices
        env:
          RAPAPORT_CLIENT_ID: ${{ secrets.RAPAPORT_CLIENT_ID }}
          RAPAPORT_CLIENT_SECRET: ${{ secrets.RAPAPORT_CLIENT_SECRET }}
        run: python3 .github/workflows/update_prices.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --staged --quiet || git commit -m "Update Rapaport prices $(date -u +%Y-%m-%d)"
          git push
